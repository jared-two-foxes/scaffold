name: PR Status

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  test-and-report:
    name: Run tests and post current state
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: pip install -e .

      - name: Run pytest
        id: pytest
        run: |
          set +e
          pytest --tb=short -q 2>&1 | tee /tmp/pytest-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Run benchmark (test-suite timings)
        run: |
          # Run the benchmark-framework unit tests with full duration reporting.
          # The --durations=0 flag emits every test's elapsed time so the PR
          # comment can surface regressions across commits without requiring
          # external repos or AI API keys.
          pytest tests/test_benchmark_acceptance.py \
                 tests/test_benchmark_fixtures.py \
                 tests/test_benchmark_models.py \
                 tests/test_benchmark_planning_graders.py \
                 tests/test_benchmark_reporting.py \
                 --tb=no -q --durations=0 2>&1 | tee /tmp/bench-output.txt || true

      - name: Post status comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/pytest-output.txt', 'utf8');
            const benchOutput = fs.readFileSync('/tmp/bench-output.txt', 'utf8');
            const exitCode = '${{ steps.pytest.outputs.exit_code }}';
            const passed = exitCode === '0';
            const icon = passed ? '✅' : '❌';
            const heading = passed ? 'All tests passed' : 'Tests failed';

            // Extract the durations section from pytest's --durations=0 output
            const durationsMatch = benchOutput.match(/={3,} slowest durations ={3,}[\s\S]*?(?=={3,}|$)/);
            const durationsSection = durationsMatch ? durationsMatch[0].trim() : benchOutput.trim();

            const body = [
              `## ${icon} Current State — ${heading}`,
              '',
              '<details>',
              '<summary>pytest output</summary>',
              '',
              '```',
              output.trim(),
              '```',
              '',
              '</details>',
              '',
              '<details>',
              '<summary>📊 Benchmark — test-suite timings (benchmark framework tests)</summary>',
              '',
              '```',
              durationsSection || '(no timing data captured)',
              '```',
              '',
              '</details>',
              '',
              `_Generated at ${new Date().toUTCString()} on commit \`${{ github.event.pull_request.head.sha }}\`_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('Current State —')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
