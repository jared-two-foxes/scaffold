[project]
name = "ticket-pipeline"
version = "0.1.0"
description = "Ticket access and criteria-stack management CLI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
scaffold = "scaffold_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ticket_pipeline", "ticket_pipeline.*", "scaffold_cli", "scaffold_cli.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
